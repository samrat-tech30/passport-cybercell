name: check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          cd backend && python -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt
          cd ../frontend && npm ci --no-audit --no-fund
      - name: Check
        run: bash scripts/check.sh
      - name: Gateway tests (integrations/, needs the mcp SDK)
        run: |
          backend/.venv/bin/pip install -q -r integrations/requirements.txt
          cd integrations && ../backend/.venv/bin/python -m pytest tests -q
